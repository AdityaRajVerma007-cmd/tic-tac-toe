<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Tic Tac Toe - Anti-Gravity</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #e2e8f0;
            --board-bg: #111827;
            --cell-border: rgba(255, 255, 255, 0.05);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent-x: #f43f5e;
            --accent-o: #10b981;
            --panel-bg: rgba(17, 24, 39, 0.6);
            --hover-color: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --board-bg: #ffffff;
            --cell-border: rgba(0, 0, 0, 0.08);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent-x: #e11d48;
            --accent-o: #059669;
            --panel-bg: rgba(255, 255, 255, 0.8);
            --hover-color: rgba(0, 0, 0, 0.03);
            --glass-border: rgba(0, 0, 0, 0.1);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Outfit', system-ui, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.15), transparent 60%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.4s, color 0.4s;
        }

        .app-container {
            max-width: 900px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            padding: 2rem 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: -1px;
        }

        h1 .neon-text {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        #theme-toggle {
            background: var(--panel-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, background 0.3s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        #theme-toggle:hover {
            transform: scale(1.1);
        }

        .game-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            align-items: flex-start;
        }

        .glass {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            border-radius: 1rem;
        }

        .settings-panel {
            flex: 1;
            min-width: 280px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .settings-panel h2 {
            margin: 0;
            font-size: 1.4rem;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .setting-group label {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b5cf6;
        }

        select {
            padding: 0.8rem;
            border-radius: 0.5rem;
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--cell-border);
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238b5cf6%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem top 50%;
            background-size: 0.65rem auto;
        }
        select:focus {
            border-color: var(--primary);
        }

        .rules {
            background: rgba(139, 92, 246, 0.1);
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            line-height: 1.5;
            border-left: 4px solid #8b5cf6;
            transition: all 0.3s;
        }

        .board-area {
            flex: 2;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .status-bar {
            display: flex;
            width: 100%;
            max-width: 400px;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
        }

        .player-score {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-score.x-score { color: var(--accent-x); }
        .player-score.o-score { color: var(--accent-o); }

        .player-score .label { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
        .player-score .score { font-size: 1.8rem; font-weight: 800; line-height: 1; margin-top: 0.2rem;}

        .turn-indicator {
            font-size: 1.2rem;
            font-weight: 600;
            padding: 0.5rem 1rem;
            background: var(--bg-color);
            border-radius: 2rem;
            border: 1px solid var(--cell-border);
            transition: all 0.3s ease;
        }

        .board-outer {
            padding: 12px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(139, 92, 246, 0.3));
            border-radius: 1.2rem;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.15);
        }

        .board {
            position: relative;
            width: 320px;
            height: 320px;
            background: var(--cell-border);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            border: 6px solid var(--cell-border);
            border-radius: 0.8rem;
            overflow: hidden; /* Keep cells constrained */
        }

        .cell {
            background: var(--board-bg);
            cursor: pointer;
            transition: background 0.2s;
        }
        .cell:hover {
            background: var(--hover-color);
        }

        #pieces-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        .piece {
            position: absolute;
            width: 33.333%;
            height: 33.333%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            font-weight: 800;
            transition: top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        transform 0.3s;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .piece.x {
            color: var(--accent-x);
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }

        .piece.o {
            color: var(--accent-o);
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #win-line {
            position: absolute;
            height: 8px;
            margin-top: -4px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            box-shadow: 0 0 15px #00f2fe;
            border-radius: 4px;
            transform-origin: 0 50%;
            opacity: 0;
            width: 0;
            transition: width 0.5s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s ease;
            pointer-events: none;
            z-index: 10;
        }

        .controls {
            display: flex;
            gap: 1rem;
            width: 100%;
            max-width: 400px;
        }

        .btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .primary-btn {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
        }
        .primary-btn:hover {
            background: var(--primary-hover);
        }

        .secondary-btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--glass-border);
        }
        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 768px) {
            .game-wrapper {
                flex-direction: column;
            }
            .board {
                width: 280px;
                height: 280px;
            }
            .piece {
                font-size: 4rem;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body data-theme="dark">

<div class="app-container">
    <header>
        <h1>TIC <span class="neon-text">TAC</span> TOE</h1>
        <button id="theme-toggle" aria-label="Toggle Theme">🌓</button>
    </header>

    <div class="game-wrapper">
        <aside class="settings-panel glass">
            <h2>Game Settings</h2>
            <div class="setting-group">
                <label for="opponent-select">Opponent</label>
                <select id="opponent-select">
                    <option value="human">Player 2 (Human)</option>
                    <option value="ai-easy">AI (Easy)</option>
                    <option value="ai-hard">AI (Unbeatable)</option>
                </select>
            </div>

            <div id="rules-text" class="rules">
                <!-- Dynamically updated -->
            </div>
        </aside>

        <main class="board-area">
            <div class="status-bar glass">
                <div class="player-score x-score">
                    <span class="label">Player X</span>
                    <span class="score" id="score-x">0</span>
                </div>
                <div class="turn-indicator" id="turn-display">X's Turn</div>
                <div class="player-score o-score">
                    <span class="label">Player O</span>
                    <span class="score" id="score-o">0</span>
                </div>
            </div>

            <div class="board-outer">
                <div class="board" id="board">
                    <!-- Grid cells for visual and click targets -->
                    <div class="cell" data-row="0" data-col="0"></div>
                    <div class="cell" data-row="0" data-col="1"></div>
                    <div class="cell" data-row="0" data-col="2"></div>
                    <div class="cell" data-row="1" data-col="0"></div>
                    <div class="cell" data-row="1" data-col="1"></div>
                    <div class="cell" data-row="1" data-col="2"></div>
                    <div class="cell" data-row="2" data-col="0"></div>
                    <div class="cell" data-row="2" data-col="1"></div>
                    <div class="cell" data-row="2" data-col="2"></div>
                    
                    <!-- Dynamic Layer -->
                    <div id="pieces-layer"></div>
                    <div id="win-line"></div>
                </div>
            </div>
            
            <div class="controls">
                <button id="btn-restart" class="btn primary-btn">Restart Game</button>
                <button id="btn-reset" class="btn secondary-btn">Reset Scores</button>
            </div>
        </main>
    </div>
</div>

<script>
    // --- State Variables ---
    let pieces = [];
    let turn = 'X';
    let scores = { X: 0, O: 0 };
    let isProcessing = false;
    let gameOver = false;
    let pieceIdCounter = 0;

    // --- DOM Elements ---
    const opponentSelect = document.getElementById('opponent-select');
    const turnDisplay = document.getElementById('turn-display');
    const layer = document.getElementById('pieces-layer');
    const winEl = document.getElementById('win-line');
    const rulesText = document.getElementById('rules-text');

    // --- Audio System ---
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        if (type === 'place') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gainNode.gain.setValueAtTime(0.4, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'shift') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.2);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'win') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.1);
            osc.frequency.setValueAtTime(800, now + 0.2);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'draw') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.3);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    // --- Core Game Logic ---
    const WIN_LINES = [
        [0,1,2], [3,4,5], [6,7,8], // rows
        [0,3,6], [1,4,7], [2,5,8], // cols
        [0,4,8], [2,4,6]           // diags
    ];

    function handleCellClick(e) {
        initAudio();
        if (isProcessing || gameOver) return;
        
        let r = parseInt(e.target.dataset.row);
        let c = parseInt(e.target.dataset.col);
        
        if (pieces.some(p => p.row === r && p.col === c)) return;
        
        executeTurn(r, c, turn);
    }

    function executeTurn(r, c, player) {
        isProcessing = true;
        
        pieces.push({ id: pieceIdCounter++, type: player, row: r, col: c });
        renderPieces();
        playSound('place');
        
        setTimeout(() => {
            const shifted = applyGravity('anti-gravity');
            if (shifted) {
                renderPieces();
                playSound('shift');
                setTimeout(() => finalizeTurn(), 400); // wait for shift animation
            } else {
                finalizeTurn();
            }
        }, 150); // slight delay to appreciate the drop position
    }

    function applyGravity(mode) {
        if (mode === 'classic') return false;
        let shifted = false;
        for (let c = 0; c < 3; c++) {
            let colPieces = pieces.filter(p => p.col === c).sort((a, b) => a.row - b.row);
            if (mode === 'anti-gravity') {
                for (let i = 0; i < colPieces.length; i++) {
                    if (colPieces[i].row !== i) {
                        colPieces[i].row = i;
                        shifted = true;
                    }
                }
            } else if (mode === 'gravity') {
                let targetRow = 2;
                for (let i = colPieces.length - 1; i >= 0; i--) {
                    if (colPieces[i].row !== targetRow) {
                        colPieces[i].row = targetRow;
                        shifted = true;
                    }
                    targetRow--;
                }
            }
        }
        return shifted;
    }

    function finalizeTurn() {
        const winInfo = checkWinStateWithLine(pieces);
        if (winInfo) {
            gameOver = true;
            if (winInfo.winner === 'draw') {
                turnDisplay.textContent = "It's a Draw!";
                turnDisplay.style.color = "var(--text-color)";
                playSound('draw');
            } else {
                turnDisplay.textContent = `${winInfo.winner} Wins!`;
                turnDisplay.style.color = winInfo.winner === 'X' ? 'var(--accent-x)' : 'var(--accent-o)';
                scores[winInfo.winner]++;
                updateScores();
                drawWinLine(winInfo.line);
                playSound('win');
            }
            isProcessing = false;
            return;
        }
        
        turn = turn === 'X' ? 'O' : 'X';
        updateTurnDisplay();
        checkAITurn();
    }

    function updateTurnDisplay() {
        turnDisplay.textContent = `${turn}'s Turn`;
        turnDisplay.style.color = turn === 'X' ? 'var(--accent-x)' : 'var(--accent-o)';
    }

    function checkWinStateWithLine(piecesState) {
        let b = Array(9).fill(null);
        piecesState.forEach(p => b[p.row * 3 + p.col] = p.type);
        
        for (let line of WIN_LINES) {
            if (b[line[0]] && b[line[0]] === b[line[1]] && b[line[1]] === b[line[2]]) {
                return { winner: b[line[0]], line: line.map(idx => [Math.floor(idx/3), idx%3]) };
            }
        }
        if (piecesState.length === 9) return { winner: 'draw' };
        return null;
    }

    function renderPieces() {
        pieces.forEach(p => {
            let el = document.getElementById(`piece-${p.id}`);
            if (!el) {
                el = document.createElement('div');
                el.id = `piece-${p.id}`;
                el.className = `piece ${p.type.toLowerCase()}`;
                el.textContent = p.type;
                layer.appendChild(el);
            }
            el.style.top = `${p.row * 33.333}%`;
            el.style.left = `${p.col * 33.333}%`;
        });
    }

    function drawWinLine(line) {
        const r1 = line[0][0], c1 = line[0][1];
        const r2 = line[2][0], c2 = line[2][1];
        
        const y1 = 16.666 + r1 * 33.333;
        const x1 = 16.666 + c1 * 33.333;
        const y2 = 16.666 + r2 * 33.333;
        const x2 = 16.666 + c2 * 33.333;
        
        const length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
        
        winEl.style.left = `${x1}%`;
        winEl.style.top = `${y1}%`;
        winEl.style.transform = `rotate(${angle}deg)`;
        winEl.style.opacity = 1;
        
        void winEl.offsetWidth; // Force reflow
        winEl.style.width = `${length}%`;
    }

    // --- AI Logic ---
    function getValidMoves(piecesState) {
        let moves = [];
        let b = Array(9).fill(null);
        piecesState.forEach(p => b[p.row * 3 + p.col] = p.type);
        for (let r=0; r<3; r++) {
            for (let c=0; c<3; c++) {
                if (!b[r * 3 + c]) moves.push({row: r, col: c});
            }
        }
        return moves;
    }

    function getBoardStateString(piecesState) {
        let b = Array(9).fill('-');
        piecesState.forEach(p => b[p.row * 3 + p.col] = p.type);
        return b.join('');
    }

    function simulateMove(currentPieces, move, type, mode) {
        let newPieces = currentPieces.map(p => ({...p}));
        newPieces.push({ row: move.row, col: move.col, type: type });
        for (let c = 0; c < 3; c++) {
            let colPieces = newPieces.filter(p => p.col === c).sort((a, b) => a.row - b.row);
            if (mode === 'anti-gravity') {
                for (let i = 0; i < colPieces.length; i++) colPieces[i].row = i;
            } else if (mode === 'gravity') {
                let targetRow = 2;
                for (let i = colPieces.length - 1; i >= 0; i--) {
                    colPieces[i].row = targetRow;
                    targetRow--;
                }
            }
        }
        return newPieces;
    }

    function minimax(piecesState, depth, isMaximizing, aiPlayer, humanPlayer, mode) {
        let winInfo = checkWinStateWithLine(piecesState);
        if (winInfo) {
            if (winInfo.winner === aiPlayer) return 10 - depth;
            if (winInfo.winner === humanPlayer) return depth - 10;
            if (winInfo.winner === 'draw') return 0;
        }
        
        let validMoves = getValidMoves(piecesState);
        if (validMoves.length === 0) return 0;
        
        let outcomes = new Set();
        let bestScore = isMaximizing ? -Infinity : Infinity;
        
        for (let move of validMoves) {
            let simPieces = simulateMove(piecesState, move, isMaximizing ? aiPlayer : humanPlayer, mode);
            let stateKey = getBoardStateString(simPieces);
            if (!outcomes.has(stateKey)) {
                outcomes.add(stateKey);
                let score = minimax(simPieces, depth + 1, !isMaximizing, aiPlayer, humanPlayer, mode);
                if (isMaximizing) {
                    bestScore = Math.max(score, bestScore);
                } else {
                    bestScore = Math.min(score, bestScore);
                }
            }
        }
        return bestScore;
    }

    function getBestMove(currentPieces, player, mode, difficulty) {
        let validMoves = getValidMoves(currentPieces);
        if (difficulty === 'easy') {
            return validMoves[Math.floor(Math.random() * validMoves.length)];
        }
        
        let bestScore = -Infinity;
        let bestMove = null;
        let humanPlayer = player === 'X' ? 'O' : 'X';
        let outcomes = new Set();
        let uniqueMoves = [];
        
        for (let move of validMoves) {
            let simPieces = simulateMove(currentPieces, move, player, mode);
            let stateKey = getBoardStateString(simPieces);
            if (!outcomes.has(stateKey)) {
                outcomes.add(stateKey);
                uniqueMoves.push(move);
            }
        }
        
        for (let move of uniqueMoves) {
            let simPieces = simulateMove(currentPieces, move, player, mode);
            let score = minimax(simPieces, 0, false, player, humanPlayer, mode);
            if (score > bestScore) {
                bestScore = score;
                bestMove = move;
            }
        }
        return bestMove;
    }

    function checkAITurn() {
        const opponent = opponentSelect.value;
        if ((opponent === 'ai-easy' || opponent === 'ai-hard') && turn === 'O' && !gameOver) {
            isProcessing = true;
            setTimeout(() => {
                const diff = opponent === 'ai-easy' ? 'easy' : 'hard';
                const move = getBestMove(pieces, 'O', 'anti-gravity', diff);
                if (move) {
                    executeTurn(move.row, move.col, 'O');
                }
            }, 600); // Artificial thinking delay
        } else {
            isProcessing = false;
        }
    }

    // --- Controls and Utilities ---
    function restartGame() {
        initAudio();
        pieces = [];
        pieceIdCounter = 0;
        turn = 'X';
        gameOver = false;
        isProcessing = false;
        layer.innerHTML = '';
        winEl.style.opacity = 0;
        winEl.style.width = '0';
        updateTurnDisplay();
        
        // If AI is playing X (not currently possible via UI but future-proofing)
        checkAITurn();
    }

    function resetScores() {
        scores = { X: 0, O: 0 };
        updateScores();
    }

    function updateScores() {
        document.getElementById('score-x').textContent = scores.X;
        document.getElementById('score-o').textContent = scores.O;
    }

    function updateRulesText() {
        rulesText.innerHTML = `<strong>Anti-Gravity Mode:</strong> Pieces shift <em>upward</em> after every move, filling empty spaces at the top. The board behaves differently!`;
    }

    // --- Event Listeners ---
    document.querySelectorAll('.cell').forEach(cell => {
        cell.addEventListener('click', handleCellClick);
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
        if(pieces.length > 0 || gameOver) playSound('shift');
        restartGame();
    });
    
    document.getElementById('btn-reset').addEventListener('click', resetScores);

    opponentSelect.addEventListener('change', () => {
        restartGame();
    });

    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.addEventListener('click', () => {
        const current = document.body.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        document.body.setAttribute('data-theme', next);
        themeToggle.textContent = next === 'light' ? '🌙' : '☀️';
    });

    // Init
    updateRulesText();
    updateTurnDisplay();

</script>
</body>
</html>
